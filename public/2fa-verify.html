<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verify Login</title>
  <link rel="stylesheet" href="style.css">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
</head>
<body>
  <div class="container">
    <h1>🔐 Two-Factor Authentication</h1>
    
    <div class="card">
      <h2>Verify Your Identity</h2>
      
      <div id="verify-container">
        <p>Please enter the verification code from your authenticator app to complete the login.</p>
        
        <div class="code-input-container">
          <input type="text" id="verification-code" 
                 placeholder="000000" maxlength="6" 
                 pattern="[0-9]{6}" 
                 inputmode="numeric" 
                 autofocus />
        </div>
        
        <button id="verify-button" class="button">Verify</button>
        
        <div class="alternative-verification">
          <a href="#" id="use-recovery-link">Use recovery code instead</a>
        </div>
        
        <div id="recovery-container" style="display: none;">
          <p>Enter one of your recovery codes:</p>
          <input type="text" id="recovery-code" 
                 placeholder="XXXX-XXXX-XXXX" 
                 pattern="[A-Z0-9]{4}-[A-Z0-9]{4}-[A-Z0-9]{4}"
                 class="recovery-input" />
          <button id="recovery-button" class="button">Use Recovery Code</button>
        </div>
        
        <div id="auth-message" class="message" style="display: none;"></div>
        
        <!-- Debug section -->
  
      </div>
    </div>
  </div>

  <script src="js/2fa-verify.js"></script>

  <style>
    .code-input-container {
      margin: 1.5rem 0;
    }
    
    #verification-code {
      font-family: monospace;
      font-size: 1.8rem;
      letter-spacing: 0.5rem;
      text-align: center;
      padding: 0.5rem;
      width: 180px;
      background-color: #333;
      color: #fff;
      border: 2px solid #00e6b8;
      border-radius: 5px;
    }
    
    .alternative-verification {
      margin: 1.5rem 0;
      font-size: 0.9rem;
    }
    
    .alternative-verification a {
      color: #33ccff;
      text-decoration: none;
    }
    
    .alternative-verification a:hover {
      text-decoration: underline;
    }
    
    #recovery-container {
      margin-top: 1.5rem;
      padding: 1.5rem;
      background-color: #222;
      border-radius: 8px;
    }
    
    .recovery-input {
      font-family: monospace;
      font-size: 1.2rem;
      text-align: center;
      padding: 0.5rem;
      width: 220px;
      background-color: #333;
      color: #fff;
      border: 2px solid #00e6b8;
      border-radius: 5px;
      margin: 1rem 0;
    }
    
    .message {
      padding: 1rem;
      border-radius: 5px;
      margin-top: 1.5rem;
      font-weight: bold;
    }
    
    .message.success {
      background-color: rgba(0, 230, 184, 0.2);
      color: #00e6b8;
      border: 1px solid #00e6b8;
    }
    
    .message.error {
      background-color: rgba(255, 51, 102, 0.2);
      color: #ff3366;
      border: 1px solid #ff3366;
    }
  </style>
</body>
</html>
