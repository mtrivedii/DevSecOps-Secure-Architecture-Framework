<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <link rel="stylesheet" href="style.css">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
</head>
<body>
  <div class="container">
    <h1>🔐 Login</h1>
    
    <div class="card">
      <h2>Account Login</h2>
      
      <form id="loginForm">
        <!-- CSRF protection token -->
        <input type="hidden" id="csrfToken" name="csrfToken" />
        
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" required 
                 autocomplete="email" />
        </div>
        
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required 
                 autocomplete="current-password" />
        </div>
        
        <div class="form-actions">
          <button type="submit" class="button" id="loginButton">Login</button>
          <a href="/" class="button secondary">Cancel</a>
        </div>
      </form>
      
      <div id="loginMessage" class="message" style="display: none;"></div>
      
      <p class="register-link">
        Don't have an account? <a href="/registration.html">Register here</a>
      </p>

      <!-- Debug section - always visible -->
    </div>
  </div>

  <script src="js/login.js"></script>

  <style>
    .form-group {
      margin-bottom: 1.5rem;
    }
    
    label {
      display: block;
      margin-bottom: 0.5rem;
      color: #00e6b8;
      font-weight: bold;
    }
    
    .form-actions {
      display: flex;
      justify-content: center; /* Center the buttons */
      gap: 1rem;
      margin-top: 2rem;
    }
    
    .button {
      min-width: 120px; /* Consistent button width */
    }
    
    .button.secondary {
      background-color: #444;
      color: white;
    }
    
    .button.secondary:hover {
      background-color: #555;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
    }
    
    .message {
      padding: 1rem;
      border-radius: 5px;
      margin-top: 1.5rem;
      font-weight: bold;
    }
    
    .message.success {
      background-color: rgba(0, 230, 184, 0.2);
      color: #00e6b8;
      border: 1px solid #00e6b8;
    }
    
    .message.error {
      background-color: rgba(255, 51, 102, 0.2);
      color: #ff3366;
      border: 1px solid #ff3366;
    }
    
    .message.info {
      background-color: rgba(51, 204, 255, 0.2);
      color: #33ccff;
      border: 1px solid #33ccff;
    }
    
    .register-link {
      margin-top: 1.5rem;
      text-align: center;
      font-size: 0.9rem;
    }
  </style>
</body>
</html>
