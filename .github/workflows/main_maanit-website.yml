name: Build, Scan, and Deploy Node.js app to Azure Web App - maanit-website

# The Azure resources have been decommissioned, so the deploy job only runs when
# started by hand (Run workflow). Pushes and pull requests build, scan and test.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # Needed for CodeQL

    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.x'

      - name: Install, Build, and Test
        run: |
          npm ci
          npm run build --if-present
          npm test

      - name: Check dependencies for known vulnerabilities (fails on high or critical)
        run: npm audit --omit=dev --audit-level=high

      - name: Check that the Bicep template compiles
        run: az bicep build --file infra/main.bicep --stdout > /dev/null

      - name: Clean Development Files
        run: |
          rm -rf mocks/
          rm -f server-dev.js
          rm -rf dev/ infra/ test/

      - name: Zip Artifact for Deployment
        run: zip -r release.zip ./

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip

  deploy:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: build-and-scan
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v8
        with:
          name: node-app

      - name: Unzip Artifact
        run: unzip release.zip

      - name: Login to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'maanit-website'
          slot-name: 'Production'
          package: .
